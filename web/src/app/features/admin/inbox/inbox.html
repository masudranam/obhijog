<div class="page">
  <header class="head">
    <h1>Department inbox</h1>
    <div class="head-actions">
      <mat-button-toggle-group
        [value]="bucket()"
        (valueChange)="onBucket($event)"
        aria-label="Which complaints to show"
      >
        @for (item of buckets; track item.value) {
          <mat-button-toggle [value]="item.value">{{ item.label }}</mat-button-toggle>
        }
      </mat-button-toggle-group>

      <app-export-button [filter]="exportFilter()" />
    </div>
  </header>

  <mat-card>
    <mat-card-content>
      <mat-form-field appearance="outline" class="search">
        <mat-label>Search</mat-label>
        <input
          matInput
          placeholder="Reference number, title or address"
          (keyup.enter)="onSearch($any($event.target).value)"
          (blur)="onSearch($any($event.target).value)"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      @if (result.isLoading()) {
        <mat-progress-bar mode="indeterminate" />
      }

      @if (result.error()) {
        <p class="empty">That did not load. Try again in a moment.</p>
      } @else if (result.value(); as page) {
        @if (page.total === 0) {
          <p class="empty">Nothing in this bucket.</p>
        } @else {
          <app-complaint-table [page]="page" (paged)="onPage($event)" />
        }
      }
    </mat-card-content>
  </mat-card>
</div>
