<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>My queue</mat-card-title>
    <mat-card-subtitle>Staff</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (me(); as user) {
      <p>Signed in as <strong>{{ user.fullName }}</strong> ({{ user.role }}).</p>
    }
    <p>The assigned-work queue arrives in M6.</p>
  </mat-card-content>
</mat-card>
