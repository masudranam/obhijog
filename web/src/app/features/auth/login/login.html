<mat-card appearance="outlined" class="auth-card">
  @if (busy()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <mat-card-header>
    <mat-card-title>Sign in</mat-card-title>
    <mat-card-subtitle>Obhijog — municipal complaints</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <mat-error>Enter a valid email address.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <mat-error>Enter your password.</mat-error>
        }
      </mat-form-field>

      <button matButton="filled" type="submit" [disabled]="form.invalid || busy()">
        Sign in
      </button>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <a matButton routerLink="/register">Create a citizen account</a>
  </mat-card-actions>
</mat-card>
