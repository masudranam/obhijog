name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

  # Credentials for containers that are created and destroyed inside a single job
  # and are unreachable from outside it. These are NOT secrets and are deliberately
  # not stored as repository secrets — a `secrets.X || 'literal'` fallback would
  # only disguise the literal. SPEC §19 records this as the one exception to
  # "no credential literals in committed files"; nothing here exists anywhere else.
  CI_DB_PASSWORD: 'Ephemeral-CI-Container-P4ssw0rd!'
  CI_JWT_SIGNING_KEY: 'ci-only-signing-key-used-by-no-deployed-environment-0123456789'

jobs:
  # What exists yet? Until M1 lands there is no solution and no Angular workspace,
  # so the gates below have nothing to run. A gate that fails because its subject
  # does not exist teaches nothing; it just trains you to ignore red.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      has-api: ${{ steps.check.outputs.has-api }}
      has-web: ${{ steps.check.outputs.has-web }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if ls ./*.sln >/dev/null 2>&1; then
            echo "has-api=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-api=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .sln yet — the API gate is skipped until M1 lands."
          fi
          if [ -f web/package.json ]; then
            echo "has-web=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-web=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No web/package.json yet — the web gate is skipped until M1 lands."
          fi

  # The gate. SPEC.md §18 — format, build with warnings as errors, then test
  # against a real PostgreSQL on the exact SHA that will merge.
  api:
    name: api gate
    needs: preflight
    if: needs.preflight.outputs.has-api == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: obhijog
          POSTGRES_PASSWORD: 'Ephemeral-CI-Container-P4ssw0rd!'
          POSTGRES_DB: obhijog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obhijog -d obhijog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Blob emulator, so attachment code paths have somewhere to talk to.
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      # Formatting first: it is the cheapest failure and the most annoying to
      # discover after a full build.
      - name: format
        run: dotnet format --verify-no-changes --no-restore

      - name: build
        run: dotnet build --configuration Release --no-restore

      # These belong on the step, not on the job: `jobs.<id>.env` cannot read the
      # `env` context, while a step's `env` can.
      - name: test
        env:
          ConnectionStrings__Postgres: 'Host=localhost;Port=5432;Database=obhijog;Username=obhijog;Password=${{ env.CI_DB_PASSWORD }};SSL Mode=Disable'
          Storage__ConnectionString: 'UseDevelopmentStorage=true'
          Jwt__SigningKey: ${{ env.CI_JWT_SIGNING_KEY }}
          SEED_PASSWORD: ${{ env.CI_DB_PASSWORD }}
        run: >-
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test.trx" --results-directory TestResults

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

  web:
    name: web gate
    needs: preflight
    if: needs.preflight.outputs.has-web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # There are zero frontend tests by decision (SPEC D6), so this build is the
      # only automated check the frontend gets. It must be warning-clean.
      - run: npm run build
        working-directory: web

  # Infrastructure. `az bicep build` is a compiler, not a deployment: it needs no
  # subscription, no credential and no network, so the template is type-checked on the exact
  # SHA that merges rather than once, by hand, on a laptop. `az bicep lint` then applies
  # infra/bicepconfig.json, where the rules that back this milestone's claims — no secret in
  # an output, no default on a secure parameter — are set to `error` rather than `warning`.
  #
  # What this job does NOT do is `az deployment group what-if`, which needs an authenticated
  # subscription. That runs from .github/workflows/deploy.yml, by hand, against a real one.
  infra:
    name: infra gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than taken from whatever the runner image ships, so a Bicep release
      # cannot turn a green gate red overnight without a commit saying so.
      - name: install bicep
        run: az bicep install --version v0.31.92

      - name: compile the template
        run: az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"

      # F15's headline property, checked rather than asserted.
      #
      # This step exists because the claim it enforces was wrong the first time it was
      # written. The template said a public firewall rule was "unrepresentable" — it is not.
      # `bicep build` compiles a `flexibleServers/firewallRules` resource with
      # `startIpAddress: '0.0.0.0'` perfectly happily; Azure's control plane rejects it at
      # deploy time because the server is VNet-injected, but nothing in this repository did.
      # Now something does, on every SHA, and the grep is over the *compiled* ARM rather than
      # over main.bicep, so it cannot be slipped past with a variable or an interpolation.
      - name: no public database firewall rule
        run: |
          set -uo pipefail
          status=0
          if grep -n '0\.0\.0\.0' "$RUNNER_TEMP/main.json"; then
            echo "::error file=infra/main.bicep::The compiled template contains 0.0.0.0. SPEC §14 F15 forbids a public firewall rule on the database."
            status=1
          fi
          if grep -ni 'firewallRules' "$RUNNER_TEMP/main.json"; then
            echo "::error file=infra/main.bicep::The compiled template declares a firewall rule. The database is VNet-injected and has no firewall (SPEC §14 F15)."
            status=1
          fi
          if [ "$status" = 0 ]; then
            echo "No 0.0.0.0 and no firewallRules in the compiled template."
          fi
          exit "$status"

      # Compiles the parameter file against the template: a parameter renamed in main.bicep
      # and not here is an error, which is the failure this catches.
      #
      # main.bicepparam reads the three secure parameters from the environment with no
      # fallback, so it will not compile without them. These are generated here, used by a
      # compiler, and thrown away with the runner — they are not credentials to anything,
      # they reach no service, and they are not the §19 literal exception either, because
      # nothing is written down. Hard-coding placeholders instead would put credential-shaped
      # strings in a committed file for no gain.
      - name: compile the parameters
        env:
          OBHIJOG_POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Aa1!aA
          OBHIJOG_JWT_SIGNING_KEY: ${{ github.sha }}${{ github.sha }}
          OBHIJOG_SEED_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Aa1!aA
        run: az bicep build-params --file infra/main.bicepparam --outfile /dev/null

      - name: lint
        run: az bicep lint --file infra/main.bicep

      # Required before the step below. The default docker driver cannot export a build
      # cache at all, so `cache-to: gha` fails the job outright without buildx.
      - uses: docker/setup-buildx-action@v3

      # F15 says the API image builds. Asserting it and verifying it are different things.
      # No push: CI proves it compiles, deploy.yml is what publishes it.
      - name: build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The hooks and the verdict recorder gate every merge. A syntax error in one of
  # them fails open, which is the worst way for a gate to fail — so this job runs
  # from the very first commit, before there is any application code.
  harness:
    name: harness scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: syntax-check hooks and bin
        run: |
          set -e
          for f in .claude/hooks/*.mjs .claude/hooks/__tests__/*.mjs .claude/bin/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done

      # The guards' failure mode is silent: one that stops working simply allows
      # everything, and nothing looks wrong. This suite exists because that happened.
      - name: guard behaviour
        run: node .claude/hooks/__tests__/run-hook-tests.mjs
